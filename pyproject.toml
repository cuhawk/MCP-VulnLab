[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-vulnlab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.18", "referencing>=0.28", "tree-sitter>=0.24,<0.26", "tree-sitter-javascript>=0.23,<0.26", "tree-sitter-typescript>=0.23,<0.24"]

[project.optional-dependencies]
test = ["pytest", "ruff"]

[project.scripts]
mcp-vulnlab = "mcp_vulnlab.cli:main"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
